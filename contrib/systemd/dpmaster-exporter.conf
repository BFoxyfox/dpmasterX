# Configuration for dpmaster-exporter.service.
# Install this file as /etc/default/dpmaster-exporter.

# Public HTTP listener.
DPMASTER_HTTP_ADDRESS=0.0.0.0
DPMASTER_HTTP_PORT=80
# Optional public reverse-proxy path, for example /int/dpmX.
# DPMASTER_HTTP_PREFIX=/int/dpmX

# HTTP abuse protection.
DPMASTER_HTTP_MAX_WORKERS=32
DPMASTER_HTTP_RATE=5
DPMASTER_HTTP_BURST=20

# Bounded UDP status enrichment. Results are cached to keep the site light.
DPMASTER_QUERY_TIMEOUT=0.8
DPMASTER_QUERY_CACHE_TTL=60

# DPMASTER_STATE_FILE=/var/lib/dpmaster/servers.state
